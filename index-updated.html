<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <meta name=\"description\" content=\"The drug information compendium at Pharmacy Commons is a free, open-access pharmacology reference providing restructed data from the FDA, WHO, NIH, and others, plus environmental impact metrics for greener prescribing.\" />\n    <link rel=\"apple-touch-icon\" href=\"/apple-touch-icon.png\" />\n    <meta name=\"apple-mobile-web-app-title\" content=\"Ph. Commons\" />\n    <title>Pharmacy Commons</title>\n    <link rel=\"icon\" href=\"/favicon.ico\" sizes=\"any\">\n    <link rel=\"icon\" href=\"/favicon.svg\" type=\"image/svg+xml\">\n    <link rel=\"apple-touch-icon\" href=\"/apple-touch-icon.png\">\n    <link rel=\"manifest\" href=\"/site.webmanifest\">\n    <!-- SPA routing: restore path from 404 redirect -->\n    <script>\n      (function() {\n        const redirect = sessionStorage.redirect\n        if (redirect && redirect !== window.location.href) {\n          // Only restore if it's different from current location\n          // This prevents infinite loops\n          delete sessionStorage.redirect\n          // Replace current history entry so back button works correctly\n          window.history.replaceState(null, null, redirect)\n        }\n      })()\n    </script>\n  </head>\n  <body>\n    <div id=\"root\"></div>\n    <script type=\"module\" src=\"/src/main.tsx\"></script>\n  </body>\n</html>\n"
