<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Pharmacy Commons</title>

    <!--
      GitHub Pages SPA fallback.

      Pages has no server-side routing, so a direct visit to /drugs/metformin
      returns this file. We stash the requested URL in sessionStorage and bounce
      to the site root; the script in index.html reads it back and hands it to
      the History API before React mounts, so the router sees the intended route.

      The key name here and in index.html must match: `redirect`.
    -->
    <script>
      (function () {
        sessionStorage.redirect = location.href;
        location.replace('/');
      })();
    </script>
  </head>
  <body>
    <p>
      If you are not redirected automatically,
      <a href="/">return to Pharmacy Commons</a>.
    </p>
  </body>
</html>
