<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Pharmacy Commons</title>\n  <!-- GitHub Pages SPA routing redirect -->\n  <!-- When a user navigates directly to /drugs/metformin, GitHub Pages returns 404.\n       This script captures the requested path and stores it, then redirects to /.\n       index.html then restores the path so React Router can handle it. -->\n  <script>\n    // Store the path that caused the 404 in sessionStorage\n    // This allows index.html to restore it after the page reloads\n    (function() {\n      const path = window.location.pathname\n      const query = window.location.search\n      const hash = window.location.hash\n      // Store full path for restoration\n      sessionStorage.redirect = path + query + hash\n    })()\n  </script>\n  <!-- Redirect to index.html with status 0 (no permanent redirect) -->\n  <meta http-equiv=\"refresh\" content=\"0;URL=/\" />\n</head>\n<body>\n  <!-- Fallback content if JavaScript is disabled -->\n  <p>If you are not redirected, <a href=\"/\">click here to return to Pharmacy Commons</a>.</p>\n</body>\n</html>\n"
